name: Repackage Release Assets

on:
  push:
    tags:
      - "v1.*"
      - "v2.*"
  workflow_dispatch:
    inputs:
      phase:
        description: "Phase to execute: 'full-release' (5 modular model packs + 3 slimmed OS bases + Setup zips + overlay + website), 'model-packs' (5 modular model weight packs), 'os-bases' (repack 3 slimmed OS bases + overlay + website), 'code-overlay' (fast ~20s incremental code update + manifest), 'standalone-ukf', 'macos-ukf', 'setup-zips', or 'atlases'"
        required: true
        type: choice
        default: "full-release"
        options:
          - "full-release"
          - "model-packs"
          - "os-bases"
          - "code-overlay"
          - "standalone-ukf"
          - "macos-ukf"
          - "setup-zips"
          - "atlases"
      release_tag:
        description: "Release tag to publish/update (v0.1.1 is immutable; use v1.0.0+)"
        required: false
        type: string
        default: "v1.0.0"
      source_release_tag:
        description: "Source release tag for OS Base runtime bootstrap (default v0.1.1)"
        required: false
        type: string
        default: "v0.1.1"
      os_targets:
        description: "JSON array of OS targets when phase is 'full-release' or 'os-bases'"
        required: false
        type: string
        default: '["windows-x64","linux-x64","macos-arm64"]'

permissions:
  contents: write
  actions: write

env:
  TARGET_RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag || 'v1.0.0' }}
  SOURCE_RELEASE_TAG: ${{ inputs.source_release_tag || 'v0.1.1' }}

jobs:
  ensure-release:
    if: github.event_name == 'push' || inputs.phase == 'full-release' || inputs.phase == 'model-packs' || inputs.phase == 'os-bases'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Ensure target GitHub Release exists (never touch v0.1.1)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$TARGET_RELEASE_TAG" = "v0.1.1" ] || [ "$TARGET_RELEASE_TAG" = "model-assets-v0.1.1" ]; then
            echo "::error::Refusing to mutate immutable legacy release $TARGET_RELEASE_TAG"
            exit 1
          fi
          NOTES_FILE="docs/release/RELEASE_NOTES_${TARGET_RELEASE_TAG}.md"
          if gh release view "$TARGET_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TARGET_RELEASE_TAG already exists."
            if [ -f "$NOTES_FILE" ]; then
              gh release edit "$TARGET_RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --title "SlicerDSpace $TARGET_RELEASE_TAG" \
                --notes-file "$NOTES_FILE"
            fi
          else
            if [ -f "$NOTES_FILE" ]; then
              gh release create "$TARGET_RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --prerelease \
                --latest=false \
                --title "SlicerDSpace $TARGET_RELEASE_TAG" \
                --notes-file "$NOTES_FILE"
            else
              gh release create "$TARGET_RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --prerelease \
                --latest=false \
                --title "SlicerDSpace $TARGET_RELEASE_TAG" \
                --notes "SlicerDSpace $TARGET_RELEASE_TAG modular release."
            fi
          fi

  build-standalone-ukf:
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'standalone-ukf'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(inputs.os_targets || '["windows-x64","linux-x64","macos-arm64"]') }}
    runs-on: ${{ matrix.target == 'windows-x64' && 'windows-2022' || (matrix.target == 'linux-x64' && 'ubuntu-22.04' || 'macos-15') }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure MSVC x64 developer environment (Windows)
        if: matrix.target == 'windows-x64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CMake 3.31 and Ninja build tool
        run: |
          python -m pip install --upgrade "cmake==3.31.6" ninja
          cmake --version

      - name: Build standalone CPU UKF (${{ matrix.target }})
        run: python scripts/build_ukf_standalone.py --target "${{ matrix.target == 'macos-arm64' && 'darwin-arm64' || matrix.target }}" --work-dir "${{ runner.temp }}/ukf-work" --out-dir "${{ runner.temp }}/ukf-out"

      - name: Upload standalone CPU UKF (${{ matrix.target }}) to model-assets-v0.1.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload model-assets-v0.1.1 --repo "${{ github.repository }}" --clobber "${{ runner.temp }}/ukf-out/${{ matrix.target == 'windows-x64' && 'ukf-standalone-windows-x64.zip' || (matrix.target == 'linux-x64' && 'ukf-standalone-linux-x64.tar.gz' || 'ukf-standalone-darwin-arm64.tar.gz') }}" "${{ runner.temp }}/ukf-out/${{ matrix.target == 'windows-x64' && 'ukf-standalone-windows-x64.zip' || (matrix.target == 'linux-x64' && 'ukf-standalone-linux-x64.tar.gz' || 'ukf-standalone-darwin-arm64.tar.gz') }}.sha256"

  build-macos-ukf:
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'macos-ukf'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CMake 3.31 and Ninja build tool
        run: |
          python3 -m pip install --upgrade "cmake==3.31.6" ninja
          cmake --version
          which cmake ninja

      - name: Build standalone arm64 UKFTractography & upload to model-assets-v0.1.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/build_macos_ukf_standalone.py \
            --work-dir "${{ runner.temp }}/ukf-work" \
            --out-dir "${{ runner.temp }}/ukf-out"
          gh release upload model-assets-v0.1.1 \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "${{ runner.temp }}/ukf-out/ukf-standalone-darwin-arm64.tar.gz" \
            "${{ runner.temp }}/ukf-out/ukf-standalone-darwin-arm64.tar.gz.sha256"

  model-packs:
    if: github.event_name == 'push' || inputs.phase == 'full-release' || inputs.phase == 'model-packs'
    needs: [ensure-release]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pack: [ddsurfer, ddseg, ddparcel, pnl_cnn, tractcloud]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build & upload modular model weight pack (${{ matrix.pack }})
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/repackage_release_assets.py build-model-pack \
            --pack "${{ matrix.pack }}" \
            --release-tag "$TARGET_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --work-dir "${{ runner.temp }}/model-work" \
            --out-dir "${{ runner.temp }}/model-out"

      - uses: actions/upload-artifact@v4
        with:
          name: model-pack-receipt-${{ matrix.pack }}
          path: ${{ runner.temp }}/model-out/model-pack-receipt-${{ matrix.pack }}.json
          if-no-files-found: error

  atlases:
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'atlases'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        atlas: [org, naba, east-west]
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build & upload WMA ${{ matrix.atlas }} archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/repackage_release_assets.py build-atlas \
            --atlas "${{ matrix.atlas }}" \
            --work-dir "${{ runner.temp }}/wma-work" \
            --out-dir "${{ runner.temp }}/wma-out"

      - uses: actions/upload-artifact@v4
        with:
          name: atlas-receipt-${{ matrix.atlas }}
          path: ${{ runner.temp }}/wma-out/atlas-receipt-${{ matrix.atlas }}.json
          if-no-files-found: error

  os-bases:
    if: ${{ !cancelled() && (needs.ensure-release.result == 'success' || needs.ensure-release.result == 'skipped') && (needs.model-packs.result == 'success' || needs.model-packs.result == 'skipped') && (github.event_name == 'push' || inputs.phase == 'full-release' || inputs.phase == 'os-bases') }}
    needs: [ensure-release, model-packs]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(inputs.os_targets || '["windows-x64","linux-x64","macos-arm64"]') }}
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download modular model-pack receipts (when built in this run)
        if: needs.model-packs.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: model-pack-receipt-*
          path: ${{ runner.temp }}/model-receipts
          merge-multiple: true

      - name: Sync model-pack manifest into checkout before repacking OS base
        if: needs.model-packs.result == 'success'
        run: |
          python .github/scripts/repackage_release_assets.py apply-model-receipts \
            --receipts-dir "${{ runner.temp }}/model-receipts" \
            --release-tag "$TARGET_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY"

      - name: Repack & upload slimmed ${{ matrix.target }} Base package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/repackage_release_assets.py repack-os-base \
            --target "${{ matrix.target }}" \
            --release-tag "$TARGET_RELEASE_TAG" \
            --source-release-tag "$SOURCE_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --work-dir "${{ runner.temp }}/base-work" \
            --out-dir "${{ runner.temp }}/base-out"

      - uses: actions/upload-artifact@v4
        with:
          name: os-base-receipt-${{ matrix.target }}
          path: ${{ runner.temp }}/base-out/os-base-receipt-${{ matrix.target }}.json
          if-no-files-found: error

  sync-metadata:
    if: ${{ !cancelled() && (needs.ensure-release.result == 'success' || needs.ensure-release.result == 'skipped') && (needs.model-packs.result == 'success' || needs.model-packs.result == 'skipped') && (needs.os-bases.result == 'success' || needs.os-bases.result == 'skipped') && (github.event_name == 'push' || inputs.phase == 'full-release' || inputs.phase == 'os-bases' || inputs.phase == 'model-packs') }}
    needs: [ensure-release, model-packs, os-bases]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download model-pack receipts
        if: needs.model-packs.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: model-pack-receipt-*
          path: ${{ runner.temp }}/receipts
          merge-multiple: true

      - name: Download OS base receipts
        if: needs.os-bases.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: os-base-receipt-*
          path: ${{ runner.temp }}/receipts
          merge-multiple: true

      - name: Sync Release SHA256SUMS.txt, setup zips, overlay, website metadata & publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git pull --rebase origin main
          python .github/scripts/repackage_release_assets.py sync-metadata \
            --receipts-dir "${{ runner.temp }}/receipts" \
            --setup-out-dir "${{ runner.temp }}/setup-zips" \
            --sha256sums-out "${{ runner.temp }}/SHA256SUMS.txt" \
            --release-tag "$TARGET_RELEASE_TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --upload-sha256sums
          python scripts/build_website_locales.py
          python -I Testing/Website/check_site.py
          gh release edit "$TARGET_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease=false \
            --latest
          if [ -n "$(git status --porcelain models/release_packs_manifest.json docs/website/ docs/site/ shared/installer_script_builder.py .github/scripts/ci_install_dspace.py Testing/Python/test_website_editorial_copy.py)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add models/release_packs_manifest.json docs/website/installer_artifacts.json docs/site/assets/js/installer-customizer.js docs/site/index.html docs/site/zh.html shared/installer_script_builder.py .github/scripts/ci_install_dspace.py Testing/Python/test_website_editorial_copy.py
            git commit -m "chore(release): publish ${TARGET_RELEASE_TAG} modular model packs, slimmed OS bases and setup zips"
            git push origin HEAD:main
            gh workflow run pages.yml --repo "$GITHUB_REPOSITORY"
          fi

  publish-setup-zips:
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'setup-zips'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build & upload 3 universal SlicerDSpaceSetup-<OS>.zip packages + SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git pull --rebase origin main
          python .github/scripts/repackage_release_assets.py sync-setup-zips \
            --out-dir "${{ runner.temp }}/setup-zips" \
            --sha256sums-out "${{ runner.temp }}/SHA256SUMS.txt" \
            --release-tag "$TARGET_RELEASE_TAG" \
            --repo "${GITHUB_REPOSITORY}"
          python scripts/build_website_locales.py
          python -I Testing/Website/check_site.py
          if [ -n "$(git status --porcelain docs/website/installer_artifacts.json docs/site/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/website/installer_artifacts.json docs/site/assets/js/installer-customizer.js docs/site/zh.html
            git commit -m "chore(release): publish ${TARGET_RELEASE_TAG} universal SlicerDSpaceSetup zips"
            git push origin HEAD:main
            gh workflow run pages.yml --repo "$GITHUB_REPOSITORY"
          fi

  publish-code-overlay:
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'code-overlay'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build & upload incremental CodeOverlay + update_manifest.json + SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git pull --rebase origin main
          python .github/scripts/repackage_release_assets.py sync-code-overlay \
            --out-dir "${{ runner.temp }}/code-overlay" \
            --sha256sums-out "${{ runner.temp }}/SHA256SUMS.txt" \
            --release-tag "$TARGET_RELEASE_TAG" \
            --repo "${GITHUB_REPOSITORY}"
          NOTES_FILE="docs/release/RELEASE_NOTES_${TARGET_RELEASE_TAG}.md"
          if [ -f "$NOTES_FILE" ]; then
            gh release edit "$TARGET_RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "SlicerDSpace $TARGET_RELEASE_TAG" \
              --notes-file "$NOTES_FILE"
          fi
          if [ -n "$(git status --porcelain docs/website/installer_artifacts.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/website/installer_artifacts.json
            git commit -m "chore(release): publish ${TARGET_RELEASE_TAG} incremental code overlay"
            git push origin HEAD:main
          fi
