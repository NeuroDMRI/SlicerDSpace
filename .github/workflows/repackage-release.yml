name: Repackage Release Assets

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Phase to execute: 'os-bases' (repack code into all 3 OS base packages + overlay + website), 'code-overlay' (fast ~20s incremental code update + manifest), 'setup-zips', or 'atlases'"
        required: true
        type: choice
        default: "os-bases"
        options:
          - "os-bases"
          - "code-overlay"
          - "setup-zips"
          - "atlases"
      release_tag:
        description: "Release tag to update (used by setup-zips)"
        required: false
        type: string
        default: "v0.1.1"
      os_targets:
        description: "JSON array of OS targets when phase is 'os-bases'"
        required: false
        type: string
        default: '["windows-x64","linux-x64","macos-arm64"]'

permissions:
  contents: write
  actions: write

jobs:
  atlases:
    if: github.event.inputs.phase == 'atlases'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        atlas: [org, naba, east-west]
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build & upload WMA ${{ matrix.atlas }} archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/repackage_release_assets.py build-atlas \
            --atlas "${{ matrix.atlas }}" \
            --work-dir "${{ runner.temp }}/wma-work" \
            --out-dir "${{ runner.temp }}/wma-out"

      - uses: actions/upload-artifact@v4
        with:
          name: atlas-receipt-${{ matrix.atlas }}
          path: ${{ runner.temp }}/wma-out/atlas-receipt-${{ matrix.atlas }}.json
          if-no-files-found: error

  os-bases:
    if: github.event.inputs.phase == 'os-bases'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(inputs.os_targets || '["windows-x64","linux-x64","macos-arm64"]') }}
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Repack & upload ${{ matrix.target }} Base package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/repackage_release_assets.py repack-os-base \
            --target "${{ matrix.target }}" \
            --work-dir "${{ runner.temp }}/base-work" \
            --out-dir "${{ runner.temp }}/base-out"

      - uses: actions/upload-artifact@v4
        with:
          name: os-base-receipt-${{ matrix.target }}
          path: ${{ runner.temp }}/base-out/os-base-receipt-${{ matrix.target }}.json
          if-no-files-found: error

  sync-metadata:
    if: github.event.inputs.phase == 'os-bases'
    needs: [os-bases]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/download-artifact@v4
        with:
          pattern: os-base-receipt-*
          path: ${{ runner.temp }}/receipts
          merge-multiple: true

      - name: Sync Release SHA256SUMS.txt, setup zips, website metadata & GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git pull --rebase origin main
          python .github/scripts/repackage_release_assets.py sync-metadata \
            --receipts-dir "${{ runner.temp }}/receipts" \
            --setup-out-dir "${{ runner.temp }}/setup-zips" \
            --sha256sums-out "${{ runner.temp }}/SHA256SUMS.txt" \
            --release-tag "${{ inputs.release_tag }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --upload-sha256sums
          python scripts/build_website_locales.py
          python -I Testing/Website/check_site.py
          if [ -n "$(git status --porcelain docs/website/installer_artifacts.json docs/site/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/website/installer_artifacts.json docs/site/assets/js/installer-customizer.js docs/site/zh.html
            git commit -m "chore(release): sync repacked ${{ inputs.release_tag }} checksums and setup zips to website"
            git push origin HEAD:main
            gh workflow run pages.yml --repo "$GITHUB_REPOSITORY"
          fi

  publish-code-overlay:
    if: github.event.inputs.phase == 'code-overlay'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build & upload incremental CodeOverlay + update_manifest.json + SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git pull --rebase origin main
          python .github/scripts/repackage_release_assets.py sync-code-overlay \
            --out-dir "${{ runner.temp }}/code-overlay" \
            --sha256sums-out "${{ runner.temp }}/SHA256SUMS.txt" \
            --release-tag "${{ inputs.release_tag }}" \
            --repo "${GITHUB_REPOSITORY}"
          if [ -n "$(git status --porcelain docs/website/installer_artifacts.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/website/installer_artifacts.json
            git commit -m "chore(release): publish ${{ inputs.release_tag }} incremental code overlay"
            git push origin HEAD:main
          fi

  publish-setup-zips:
    if: github.event.inputs.phase == 'setup-zips'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build & upload 3 universal SlicerDSpaceSetup-<OS>.zip packages + SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git pull --rebase origin main
          python .github/scripts/repackage_release_assets.py sync-setup-zips \
            --out-dir "${{ runner.temp }}/setup-zips" \
            --sha256sums-out "${{ runner.temp }}/SHA256SUMS.txt" \
            --release-tag "${{ inputs.release_tag }}" \
            --repo "${GITHUB_REPOSITORY}"
          python scripts/build_website_locales.py
          python -I Testing/Website/check_site.py
          if [ -n "$(git status --porcelain docs/website/installer_artifacts.json docs/site/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/website/installer_artifacts.json docs/site/assets/js/installer-customizer.js docs/site/zh.html
            git commit -m "chore(release): publish ${{ inputs.release_tag }} universal SlicerDSpaceSetup zips"
            git push origin HEAD:main
            gh workflow run pages.yml --repo "$GITHUB_REPOSITORY"
          fi

  publish-code-overlay:
    if: github.event.inputs.phase == 'code-overlay'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build & upload incremental CodeOverlay + update_manifest.json + SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git pull --rebase origin main
          python .github/scripts/repackage_release_assets.py sync-code-overlay \
            --out-dir "${{ runner.temp }}/code-overlay" \
            --sha256sums-out "${{ runner.temp }}/SHA256SUMS.txt" \
            --release-tag "${{ inputs.release_tag }}" \
            --repo "${GITHUB_REPOSITORY}"
          if [ -n "$(git status --porcelain docs/website/installer_artifacts.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/website/installer_artifacts.json
            git commit -m "chore(release): publish ${{ inputs.release_tag }} incremental code overlay"
            git push origin HEAD:main
          fi
