name: Slicer compatibility matrix (real stock Slicer)

# Runs REAL, stock 3D Slicer (not the developer's Mac, whose Slicer has extra pip packages) headless on
# GitHub-hosted runners, so cross-platform support is measured instead of claimed.
#
#   repo-only    stock Slicer + this checkout staged as an extension-like tree (light, minutes).
#                The bundled Python packages are absent, so the DTI worker run is allowed to be
#                "skipped" when it only fails on a missing third-party package.
#   full-install stock Slicer + the released v0.1.1 base asset installed by the website installer, then
#                this checkout overlaid on the installed layout (heavy, about 1.5 GB download).
#                The DTI worker run is required to pass. Linux also scans ELF files for GLIBC (X8).
#
# Start it from the Actions tab or with: gh workflow run slicer-compat-matrix.yml --ref <branch>
# (manual only: the repository policy forbids push/schedule triggers).
# No secrets are used beyond the automatic GITHUB_TOKEN (read-only, for gh release download).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slicer-compat-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: '1'
  PYTHONNOUSERSITE: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  repo-only:
    name: repo-only (${{ matrix.os }}, Slicer ${{ matrix.slicer }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
        slicer: ['5.10.0', '5.12.4']
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Show runner
        shell: bash
        run: |
          echo "runner: $RUNNER_OS $RUNNER_ARCH, python: $(python --version)"
          uname -a || true
          df -h . || true

      - name: macOS - install Rosetta (the stock Slicer build is x86_64)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "Installing Rosetta 2 if it is missing"
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "Rosetta is already available"
          else
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          arch -x86_64 /usr/bin/true && echo "x86_64 binaries run: OK"

      - name: Linux - install the system libraries Slicer needs
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "Installing Slicer runtime libraries and xvfb"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libglu1-mesa libpulse-mainloop-glib0 libnss3 libasound2 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libxkbcommon0 \
            libegl1 libopengl0 libxrender1 libxi6 libxt6 libsm6 libice6 libdbus-1-3 libfontconfig1 \
            libxcomposite1 libxcursor1 libxdamage1 libxrandr2 libxtst6 libxss1 binutils

      - name: Cache the Slicer download
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/slicer-dl
          key: slicer-dl-${{ matrix.os }}-${{ matrix.slicer }}

      - name: Download and install stock Slicer ${{ matrix.slicer }}
        id: slicer
        shell: bash
        run: python .github/scripts/ci_install_slicer.py --version "${{ matrix.slicer }}"

      - name: Linux - print missing shared libraries of Slicer (diagnostic)
        if: runner.os == 'Linux'
        shell: bash
        env:
          SLICER_HOME: ${{ steps.slicer.outputs.slicer_home }}
        run: |
          for exe in "$SLICER_HOME"/bin/SlicerApp-real "$SLICER_HOME"/bin/PythonSlicer; do
            echo "== ldd $exe"
            ldd "$exe" | grep "not found" || echo "no missing libraries"
          done

      - name: Stage this checkout as an extension-like tree
        id: stage
        shell: bash
        run: |
          MINOR=$(echo "${{ matrix.slicer }}" | cut -d. -f1,2)
          python scripts/stage_slicer_extension.py --install-root "$RUNNER_TEMP/dspace-stage" \
            --slicer-version "Slicer-$MINOR" --clean --link-mode copy > "$RUNNER_TEMP/stage.json"
          echo "module_dir=$RUNNER_TEMP/dspace-stage/SlicerDSpace/lib/Slicer-$MINOR/qt-scripted-modules" >> "$GITHUB_OUTPUT"
          echo "staged to $RUNNER_TEMP/dspace-stage/SlicerDSpace/lib/Slicer-$MINOR/qt-scripted-modules"

      - name: Run the headless smoke through real Slicer
        id: smoke
        shell: bash
        env:
          SLICER_EXE: ${{ steps.slicer.outputs.slicer_exe }}
          MODULE_DIR: ${{ steps.stage.outputs.module_dir }}
        run: |
          python .github/scripts/ci_run_slicer_smoke.py --slicer-exe "$SLICER_EXE" --module-dir "$MODULE_DIR" \
            --mode repo-only --pipeline optional

      - name: Unit test suite under the real PythonSlicer (report only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 40
        shell: bash
        env:
          PYTHON_SLICER: ${{ steps.slicer.outputs.python_slicer }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-artifacts"
          export PYTHONPATH="$WORKSPACE"
          echo "PythonSlicer: $PYTHON_SLICER"
          "$PYTHON_SLICER" --version || true
          "$PYTHON_SLICER" -m unittest discover -s Testing/Python -p 'test_*.py' 2>&1 | tee "$RUNNER_TEMP/ci-artifacts/unittest.log"
          exit "${PIPESTATUS[0]}"

      - name: Upload reports and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: slicer-compat-repo-only-${{ matrix.os }}-${{ matrix.slicer }}
          path: ${{ runner.temp }}/ci-artifacts
          if-no-files-found: warn
          retention-days: 14

  full-install:
    name: full-install (${{ matrix.os }}, Slicer ${{ matrix.slicer }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
        slicer: ['5.10.0', '5.12.4']
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Show runner
        shell: bash
        run: |
          echo "runner: $RUNNER_OS $RUNNER_ARCH, python: $(python --version)"
          uname -a || true
          df -h . || true

      - name: Linux - free disk space (the base asset is about 1.5 GB and unpacks larger)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "Removing preinstalled toolchains this job does not use"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: macOS - install Rosetta (the stock Slicer build is x86_64)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "Installing Rosetta 2 if it is missing"
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "Rosetta is already available"
          else
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          arch -x86_64 /usr/bin/true && echo "x86_64 binaries run: OK"

      - name: Linux - install the system libraries Slicer needs
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "Installing Slicer runtime libraries and xvfb"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libglu1-mesa libpulse-mainloop-glib0 libnss3 libasound2 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libxkbcommon0 \
            libegl1 libopengl0 libxrender1 libxi6 libxt6 libsm6 libice6 libdbus-1-3 libfontconfig1 \
            libxcomposite1 libxcursor1 libxdamage1 libxrandr2 libxtst6 libxss1 binutils

      - name: Cache the Slicer download
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/slicer-dl
          key: slicer-dl-${{ matrix.os }}-${{ matrix.slicer }}

      - name: Download and install stock Slicer ${{ matrix.slicer }}
        id: slicer
        shell: bash
        run: python .github/scripts/ci_install_slicer.py --version "${{ matrix.slicer }}"

      - name: Linux - print missing shared libraries of Slicer (diagnostic)
        if: runner.os == 'Linux'
        shell: bash
        env:
          SLICER_HOME: ${{ steps.slicer.outputs.slicer_home }}
        run: |
          for exe in "$SLICER_HOME"/bin/SlicerApp-real "$SLICER_HOME"/bin/PythonSlicer; do
            echo "== ldd $exe"
            ldd "$exe" | grep "not found" || echo "no missing libraries"
          done

      - name: Diagnostics - extension state before the installer
        if: ${{ !cancelled() }}
        shell: bash
        env:
          SLICER_EXE: ${{ steps.slicer.outputs.slicer_exe }}
        run: python .github/scripts/ci_debug_state.py --label pre-install --slicer-exe "$SLICER_EXE"

      - name: Install SlicerDSpace v0.1.1 with the website installer, then overlay this checkout
        id: dspace
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SLICER_EXE: ${{ steps.slicer.outputs.slicer_exe }}
          PYTHON_SLICER: ${{ steps.slicer.outputs.python_slicer }}
        run: |
          python .github/scripts/ci_install_dspace.py --slicer-exe "$SLICER_EXE" --python-slicer "$PYTHON_SLICER"

      - name: Run the headless smoke through real Slicer
        id: smoke
        shell: bash
        env:
          SLICER_EXE: ${{ steps.slicer.outputs.slicer_exe }}
          MODULE_DIR: ${{ steps.dspace.outputs.module_dir }}
        run: |
          python .github/scripts/ci_run_slicer_smoke.py --slicer-exe "$SLICER_EXE" --module-dir "$MODULE_DIR" \
            --mode full-install --pipeline required

      - name: Fail - the website installer left SlicerDSpace scheduled for uninstall
        if: ${{ !cancelled() && fromJSON(steps.dspace.outputs.scheduled_uninstall_cancelled || '0') > 0 }}
        shell: bash
        run: |
          echo "::error title=Product installer bug::After a clean install the Slicer settings list SlicerDSpace under Extensions/ScheduledForUninstall; the next Slicer start deletes the extension. The smoke below ran only because CI removed that entry (see the installer step log)."
          exit 1

      - name: Diagnostics - extension state after the smoke
        if: ${{ !cancelled() }}
        shell: bash
        env:
          SLICER_EXE: ${{ steps.slicer.outputs.slicer_exe }}
          EXT_ROOT: ${{ steps.dspace.outputs.ext_root }}
        run: python .github/scripts/ci_debug_state.py --label post-smoke --slicer-exe "$SLICER_EXE" --ext-root "$EXT_ROOT"

      - name: Linux - X8 GLIBC scan of bundled-runtimes and bundled-python (fails above GLIBC 2.28)
        if: ${{ runner.os == 'Linux' && !cancelled() }}
        shell: bash
        env:
          EXT_ROOT: ${{ steps.dspace.outputs.ext_root }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-artifacts"
          python .github/scripts/ci_glibc_scan.py "$EXT_ROOT/bundled-runtimes" "$EXT_ROOT/bundled-python" \
            --limit 2.28 --json "$RUNNER_TEMP/ci-artifacts/glibc_scan.json" 2>&1 | tee "$RUNNER_TEMP/ci-artifacts/glibc_scan.txt"
          exit "${PIPESTATUS[0]}"

      # Not run on macOS: in run 44825474979 both macOS full-install jobs lost
      # their runner ("The hosted runner lost communication with the server")
      # during this step, after the install and the smoke had passed, and the
      # step logs were lost. The same suite passed on macOS repo-only (736 s),
      # so the resource problem comes with the installed bundle. The cause is
      # not proven. The suite is report-only, and the smoke above is the gate.
      - name: Unit test suite under the real PythonSlicer (report only)
        if: ${{ runner.os != 'macOS' && !cancelled() }}
        continue-on-error: true
        timeout-minutes: 40
        shell: bash
        env:
          PYTHON_SLICER: ${{ steps.slicer.outputs.python_slicer }}
          WORKSPACE: ${{ github.workspace }}
          EXT_ROOT: ${{ steps.dspace.outputs.ext_root }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-artifacts"
          # Bundled packages first, as the product's workers do; then the checkout.
          if [ "$RUNNER_OS" = "Windows" ]; then SEP=';'; else SEP=':'; fi
          export PYTHONPATH="$EXT_ROOT/bundled-python/site-packages$SEP$WORKSPACE"
          echo "PYTHONPATH=$PYTHONPATH"
          "$PYTHON_SLICER" --version || true
          "$PYTHON_SLICER" -m unittest discover -s Testing/Python -p 'test_*.py' 2>&1 | tee "$RUNNER_TEMP/ci-artifacts/unittest.log"
          exit "${PIPESTATUS[0]}"

      - name: Upload reports and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: slicer-compat-full-install-${{ matrix.os }}-${{ matrix.slicer }}
          path: ${{ runner.temp }}/ci-artifacts
          if-no-files-found: warn
          retention-days: 14
